<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scoreboard — Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="themes.css" />
  </head>
  <body>
    <div id="version" data-i18n="versionText">Scoreboard 0.05 Beta</div>
    <div id="stage">
      <div id="sb" class="hidden" data-pos="bottom">
        <div class="bar" id="bar">
          <div class="brand">
            <div class="brand-logo-wrap">
              <img id="leagueLogo" class="brand-logo" alt="" draggable="false" />
              <span class="img-fallback" id="leagueLogoFb"></span>
            </div>
            <div class="brand-name" id="leagueName">LİG</div>
          </div>

          <div class="team home">
            <div class="team-row">
              <div class="crest-wrap">
                <img id="homeCrest" class="crest" alt="" draggable="false" />
                <span class="img-fallback" id="homeCrestFb"></span>
              </div>
              <div class="team-info">
                <div class="cards" id="homeCards"></div>
                <span id="homeName" class="tname">EV</span>
                <div class="goals" id="homeGoals"></div>
                <div id="homePenFlash" class="pen-flash hidden"></div>
              </div>
            </div>
          </div>

          <div class="center">
            <div class="score-block">
              <div class="score-wrap">
                <div class="score-league-wrap">
                  <img id="midLogo" class="mid-logo" alt="" draggable="false" />
                  <span class="img-fallback mid" id="midLogoFb"></span>
                </div>
                <div class="score" id="score">
                  <span id="scoreHome" class="sc">-</span>
                  <span class="sep-col">
                    <span class="sep">:</span>
                    <span id="clock" class="clock">00'</span>
                  </span>
                  <span id="scoreAway" class="sc">-</span>
                </div>
              </div>
              <div class="sub">
                <span id="centerLeague" class="center-league"></span>
                <span class="live"><span class="livedot"></span><span id="liveText">CANLI</span></span>
              </div>
            </div>
          </div>

          <div class="team away">
            <div class="team-row">
              <div class="team-info">
                <div class="cards" id="awayCards"></div>
                <span id="awayName" class="tname">DEP</span>
                <div class="goals" id="awayGoals"></div>
                <div id="awayPenFlash" class="pen-flash hidden"></div>
              </div>
              <div class="crest-wrap">
                <img id="awayCrest" class="crest" alt="" draggable="false" />
                <span class="img-fallback" id="awayCrestFb"></span>
              </div>
            </div>
          </div>
        </div>

        <div id="empty" class="empty hidden">
          <div class="empty-inner">
            <div class="empty-pulse"></div>
            <div data-i18n="noMatchSelected">Maç seçilmedi</div>
            <div class="empty-sub" data-i18n="noMatchSelectedSub">Scoreboard kontrol panelinden maç ekleyin</div>
          </div>
        </div>
      </div>

      <div id="statsPanel" class="stats-panel hidden">
        <div class="stats-inner">
          <div class="stats-head">
            <span id="statsTitle" class="stats-title">İSTATİSTİK</span>
            <span id="statsMatch" class="stats-match"></span>
          </div>
          <div id="statsBody" class="stats-body"></div>
        </div>
      </div>

      <div id="goalPanel" class="goal-panel hidden">
        <div class="goal-inner">
          <div class="goal-photo-wrap">
            <img id="goalPhoto" class="goal-photo" alt="" draggable="false" />
            <span class="img-fallback" id="goalPhotoFb"></span>
          </div>
          <div class="goal-body">
            <span class="goal-tag" id="goalTag">GOL</span>
            <span class="goal-name" id="goalName"></span>
            <span class="goal-min" id="goalMin"></span>
            <span class="goal-assist" id="goalAssist"></span>
          </div>
        </div>
      </div>

      <div id="subPanel" class="sub-panel hidden">
        <div class="sub-inner">
          <div class="sub-head">
            <span class="sub-title" data-i18n="subTitle">OYUNCU DEĞİŞİKLİĞİ</span>
            <span id="subTeam" class="sub-team"></span>
            <span id="subMin" class="sub-min"></span>
          </div>
          <div class="sub-row">
            <div class="sub-photo-wrap">
              <img id="subInPhoto" class="sub-photo" alt="" draggable="false" />
              <span class="img-fallback" id="subInPhotoFb"></span>
            </div>
            <span class="sub-arrow up">▲</span>
            <span id="subInName" class="sub-name">–</span>
          </div>
          <div class="sub-row">
            <div class="sub-photo-wrap">
              <img id="subOutPhoto" class="sub-photo" alt="" draggable="false" />
              <span class="img-fallback" id="subOutPhotoFb"></span>
            </div>
            <span class="sub-arrow down">▼</span>
            <span id="subOutName" class="sub-name">–</span>
          </div>
        </div>
      </div>

      <div id="lineupPanel" class="lineup-panel hidden">
        <div class="lineup-inner">
          <div class="lineup-head">
            <span class="lineup-title" id="lineupTitle" data-i18n="lineupTitle">İLK 11</span>
            <span id="lineupMatch" class="lineup-match"></span>
          </div>
          <div class="lineup-cols">
            <div class="lineup-col">
              <div class="lineup-team">
                <span class="lineup-crest-wrap">
                  <img id="lineupHomeCrest" class="lineup-crest" alt="" draggable="false" />
                  <span class="img-fallback" id="lineupHomeCrestFb"></span>
                </span>
                <span id="lineupHomeName" class="lineup-tname"></span>
                <span id="lineupHomeFormation" class="lineup-formation"></span>
              </div>
              <div id="lineupHomeBody" class="lineup-body"></div>
            </div>
            <div class="lineup-divider"></div>
            <div class="lineup-col">
              <div class="lineup-team">
                <span class="lineup-crest-wrap">
                  <img id="lineupAwayCrest" class="lineup-crest" alt="" draggable="false" />
                  <span class="img-fallback" id="lineupAwayCrestFb"></span>
                </span>
                <span id="lineupAwayName" class="lineup-tname"></span>
                <span id="lineupAwayFormation" class="lineup-formation"></span>
              </div>
              <div id="lineupAwayBody" class="lineup-body"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/i18n.js"></script>
    <script src="teamColors.js?v=2"></script>
    <script src="app.js"></script>
  </body>
</html>
